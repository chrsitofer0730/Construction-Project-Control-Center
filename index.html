<style>
:root{
  --ink:#221F1F; --ink-soft:#4a4746; --paper:#FFFFFF; --canvas:#F6F5F3;
  --line:#E4E1DC; --grey:#888888; --orange:#F58220; --yellow:#FFC72C;
  --ok:#2E8B57; --warn:#C0392B; --card:#FFFFFF;
  --radius:10px;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --ink:#F2EFEA; --ink-soft:#C9C4BC; --paper:#211E1B; --canvas:#171513;
    --line:#3A352F; --grey:#9A948B; --card:#26221E;
  }
}
:root[data-theme="dark"]{
  --ink:#F2EFEA; --ink-soft:#C9C4BC; --paper:#211E1B; --canvas:#171513;
  --line:#3A352F; --grey:#9A948B; --card:#26221E;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;letter-spacing:-0.01em;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--orange);}
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;flex:0 0 220px;background:var(--ink);color:#EDE9E3;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:22px;padding:0 6px;}
.brand-mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--orange),var(--yellow));flex:0 0 30px;}
.brand-text{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;line-height:1.2;}
.brand-text span{display:block;font-family:'Inter';font-weight:400;font-size:10.5px;color:#B8B2A8;}
.nav-group{margin-bottom:14px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8C8578;padding:6px 10px 2px;}
.nav-btn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:none;color:#D9D4CB;padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:2px;}
.nav-btn:hover{background:#332F2B;}
.nav-btn.active{background:var(--orange);color:#1B1815;font-weight:600;}
.proj-picker{background:#2C2823;border-radius:8px;padding:9px 10px;margin-bottom:16px;}
.proj-picker select{width:100%;background:transparent;color:#F2EFEA;border:none;font-size:12.5px;font-weight:600;}
.proj-picker select option{color:#111;}
.main{flex:1;padding:26px 34px;max-width:1180px;}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.pagehead p{color:var(--ink-soft);margin:4px 0 0;font-size:13px;}
.btn{border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#221100;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.grid{display:grid;gap:14px;}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.stat{display:flex;flex-direction:column;gap:2px;}
.stat .num{font-family:'Space Grotesk';font-size:26px;font-weight:700;}
.stat .lbl{font-size:11.5px;color:var(--ink-soft);}
.stat.warn .num{color:var(--warn);}
.section-title{font-size:15px;margin:26px 0 10px;font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:rgba(245,130,32,0.04);}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.pending{background:#FFF1D6;color:#8A5A00;}
.badge.approved,.badge.paid,.badge.delivered,.badge.closed{background:#DEF3E4;color:#1B6B3C;}
.badge.overdue,.badge.rejected{background:#FBE0DC;color:#A5301F;}
.badge.review{background:#E4E9FB;color:#2E4EA5;}
.badge.superseded{background:#EDEBE7;color:#6b665e;}
:root[data-theme="dark"] .badge.pending,:root:not([data-theme=light]){ }
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:var(--radius);}
.empty h3{color:var(--ink);margin-bottom:6px;}
.modal-bg{position:fixed;inset:0;background:rgba(20,17,14,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:50;}
.modal{background:var(--paper);border-radius:14px;max-width:640px;width:100%;padding:24px 26px;margin-bottom:5vh;}
.modal h2{margin-bottom:2px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--ink-soft);}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--canvas);color:var(--ink);font-family:inherit;font-size:13px;}
.field textarea{min-height:70px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;color:var(--ink-soft);margin-bottom:16px;transition:border-color .15s;}
.dropzone.drag{border-color:var(--orange);color:var(--orange);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--orange);border-bottom-color:var(--orange);}
.activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.activity-item .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);margin-top:5px;flex:0 0 7px;}
.activity-item .t{color:var(--grey);font-size:11px;}
.ai-box{background:linear-gradient(135deg,#2A2622,#1B1815);color:#F2EFEA;border-radius:12px;padding:18px 20px;margin-bottom:18px;}
.ai-box h3{color:#FFC72C;}
.ai-suggest{background:#FDF3E4;border:1px solid var(--yellow);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.ai-suggest h4{color:#8A5A00;margin-bottom:8px;font-size:13px;}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:12.5px;margin-bottom:3px;}
.kv b{color:var(--ink-soft);font-weight:600;}
.chat-log{max-height:340px;overflow-y:auto;margin-bottom:12px;}
.chat-msg{padding:10px 13px;border-radius:10px;margin-bottom:8px;font-size:13px;max-width:85%;}
.chat-msg.user{background:var(--orange);color:#221100;margin-left:auto;}
.chat-msg.ai{background:var(--card);border:1px solid var(--line);}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.muted{color:var(--ink-soft);font-size:12.5px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#F2EFEA;padding:11px 18px;border-radius:9px;font-size:13px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.icon-x{background:none;border:none;color:var(--ink-soft);font-size:18px;line-height:1;padding:2px 6px;}
.demo-flag{background:var(--yellow);color:#5A3D00;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;}
.limits-note{font-size:11.5px;color:var(--ink-soft);border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
.overflow-x{overflow-x:auto;}
.lock-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#2C2823;border-radius:8px;padding:8px 10px;margin-bottom:12px;font-size:11.5px;color:#D9D4CB;}
.lock-bar.is-unlocked{background:#233A2C;}
.lock-bar .lock-status{font-weight:600;}
.lock-bar .lock-btn{padding:4px 10px;font-size:11.5px;border-radius:6px;background:transparent;border:1px solid #55504A;color:#EDE9E3;}
td.editable-cell{cursor:pointer;position:relative;}
td.editable-cell:hover{background:rgba(245,130,32,0.09);outline:1px dashed var(--orange);outline-offset:-2px;}
td.editing{background:rgba(245,130,32,0.06);padding:5px 6px;}
td.editing input, td.editing select{width:100%;padding:6px 8px;border:1.5px solid var(--orange);border-radius:6px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:13px;}
td.locked-cell{cursor:default;}
.row-actions{display:flex;gap:4px;white-space:nowrap;}
.row-actions .btn{padding:4px 8px;font-size:12px;}
.row-actions .btn.danger{color:var(--warn);border-color:var(--warn);}
.security-note{font-size:11.5px;color:var(--ink-soft);background:var(--canvas);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;}
</style>

<div id="root"></div>

<script>
/* ============================================================
   CONSTRUCTION VA PROJECT CONTROL CENTER
   Real persistence via `db`, real files via `assets`,
   real AI classification/summaries via `sample`, real
   downloads via `downloads`. See in-app "Settings > About
   this build" for what still needs external services.
   ============================================================ */

const STATUS_META = {
  submitted:'pending', pending:'pending', 'under review':'review', 'revise & resubmit':'overdue',
  'revise and resubmit':'overdue', approved:'approved', rejected:'overdue', open:'pending',
  answered:'review', closed:'closed', overdue:'overdue', delivered:'delivered', delayed:'overdue',
  paid:'paid', current:'approved', superseded:'superseded', 'pending approval':'pending', draft:'pending',
  'not submitted':'pending', 'approved as noted':'approved', resubmitted:'review',
  'pending response':'pending',
};
function badge(status){
  const s=(status||'').toLowerCase();
  const cls = STATUS_META[s] || 'pending';
  return `<span class="badge ${cls}">${status||'—'}</span>`;
}

// ---------- discipline constants (Material Submittal / Shop Drawing Submittal / RFI) ----------
const DISCIPLINES = ['Structural','Architectural','Mechanical','Electrical','Plumbing'];
const DISCIPLINE_CODE = {S:'Structural',A:'Architectural',M:'Mechanical',E:'Electrical',P:'Plumbing'};
function disciplineFromText(text){
  if(!text) return null;
  const t = text.toUpperCase();
  // e.g. MS-M-024, SD-A-015 Rev 02, RFI-S-008
  const m = t.match(/\b(?:MS|SD|RFI)-([SAMEP])-?\d*/);
  if(m && DISCIPLINE_CODE[m[1]]) return DISCIPLINE_CODE[m[1]];
  for(const d of DISCIPLINES){ if(t.includes(d.toUpperCase())) return d; }
  return null;
}
function distinctVals(docs, key){ return [...new Set(docs.map(d=>d[key]).filter(Boolean))].sort(); }
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;} }
function daysUntil(d){ if(!d) return null; const diff = (new Date(d) - new Date()); return Math.ceil(diff/86400000); }
function toast(msg){
  let t=document.getElementById('toast'); if(t) t.remove();
  t=document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3200);
}

// ---------- edit-lock: password hashing (client-side only — see Settings > Security for limitations) ----------
// Call before any mutating action. Returns true if editing is already unlocked;
// otherwise opens the real sign-in modal and returns false. Always false in
// client view mode — clients never get an edit prompt at all.
function requireUnlock(){
  if(State.clientMode) return false;
  if(State.unlocked) return true;
  State.modal = { type: 'unlock' };
  render();
  return false;
}
function lockApp(){
  State.unlocked = false;
  State.editingCell = null;
  State.modal = null;
  if(fbAuth) fbAuth.signOut().catch(()=>{});
  toast('Editing locked');
  render();
}

// ---------- capability handles ----------
// Standalone build: data persists in Firebase Firestore so both you and
// any client visiting the link see the same live project data. Only a
// signed-in admin (you) can write — enforced by Firestore's own security
// rules, not just hidden buttons. AI classification/summaries and cloud
// asset upload aren't available outside the Claude artifact viewer, so
// those two stay null — the app already falls back gracefully wherever
// they're used (manual classification, plain <a download>).
let dbApi=null, assetsApi=null, sampleApi=null, downloadsApi=null;
let fbAuth=null;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD8RwhVLfcH7a9r7eXytPBNJZwEqaeeUJM",
  authDomain: "project-control-center-8888.firebaseapp.com",
  projectId: "project-control-center-8888",
  storageBucket: "project-control-center-8888.firebasestorage.app",
  messagingSenderId: "624990846175",
  appId: "1:624990846175:web:90fa662eed467e6be2fd6a"
};

function makeFirestoreDb(){
  const db = firebase.firestore();
  return {
    collection(name){
      const col = db.collection(name);
      return {
        async get(){
          const snap = await col.get();
          return snap.docs.map(d => ({ id: d.id, data: d.data() }));
        },
        doc(id){
          const ref = col.doc(id);
          return {
            async get(){
              const snap = await ref.get();
              return snap.exists ? { id, data: snap.data() } : null;
            },
            async set(data){ await ref.set(data); },
            async delete(){ await ref.delete(); }
          };
        }
      };
    }
  };
}

async function initCaps(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    dbApi = makeFirestoreDb();
    fbAuth = firebase.auth();
    // Keep State.unlocked in sync with real Firebase Auth sign-in state,
    // so a signed-in admin stays unlocked across reloads on their own device.
    fbAuth.onAuthStateChanged(user => {
      State.unlocked = !!user && !State.clientMode;
      render();
    });
  }catch(e){
    console.warn('Firebase init failed — check your firebaseConfig / network', e);
    dbApi = null;
  }
}

// ---------- in-memory cache mirrors of db collections ----------
const State = {
  projects: [], documents: [], tasks: [], activity: [],
  activeProjectId: null, route:'dashboard', loading:true, demoMode:false,
  moduleFilters: { materialsubmittal:{discipline:'ALL',search:''}, shopdrawing:{discipline:'ALL',search:''}, rfi:{discipline:'ALL',search:''} },
  dashboardDiscipline: 'ALL',
  // ---- editing security & inline cell editing ----
  unlocked:false,       // true once signed in with the admin Firebase account this session
  editingCell:null,      // {docId, field} — which single cell is currently in edit mode
  // Client view: permanently read-only, no edit/upload/settings UI. Set once at
  // load time from ?client=1 in the URL — this is the link you hand to clients.
  clientMode: new URLSearchParams(window.location.search).get('client') === '1',
};

    {id:uid(),projectId:DEMO_ID,type:'RFI',number:'RFI-M-009',discipline:'Mechanical',subject:'AHU Duct Routing Clash',date:iso(2),submittedBy:'MEP Subcontractor',reviewer:'MEP Consultant',priority:'High',question:'Requesting resolution of a ductwork clash with a structural beam at Level 3.',status:'Under Review',summary:'MEP subcontractor flags a ductwork/structural clash at Level 3 requiring consultant direction.',fileName:'RFI-M-009 Duct Clash.pdf',revision:null,dueDate:isoFuture(2),createdAt:iso(2)},

// ---------- db persistence helpers ----------
async function loadAll(){
  State.loading = true; render();
  if(dbApi){
    try{
      const [p,d,t,a] = await Promise.all([
        dbApi.collection('projects').get(),
        dbApi.collection('documents').get(),
        dbApi.collection('tasks').get(),
        dbApi.collection('activity').get(),
      ]);
      State.projects = (p||[]).map(x=>x.data ? {...x.data,id:x.id} : x);
      State.documents = (d||[]).map(x=>x.data ? {...x.data,id:x.id} : x);
      State.tasks = (t||[]).map(x=>x.data ? {...x.data,id:x.id} : x);
      State.activity = (a||[]).map(x=>x.data ? {...x.data,id:x.id} : x);
    }catch(e){ console.warn('db load failed, falling back to demo-only view', e); }
  }
  if(!State.clientMode && State.projects.filter(p=>p.id!==DEMO_ID).length===0 && State.projects.length===0){
    buildDemoData();
    State.demoMode = true;
  } else if(!State.projects.find(p=>p.id===DEMO_ID)){
    // keep user's real projects, still offer demo alongside if none exists elsewhere is unnecessary
  }
  if(!State.activeProjectId){
    const real = State.projects.find(p=>p.id!==DEMO_ID);
    State.activeProjectId = real ? real.id : (State.projects[0]?.id || null);
  }
  State.loading = false;
  render();
}

function computeStats(discipline){
  let docs = projDocs();
  if(discipline && discipline!=='ALL') docs = docs.filter(d=>d.discipline===discipline);
  const now = Date.now();
  const isOverdue = d => d.dueDate && new Date(d.dueDate).getTime() < now && !['closed','approved','paid','delivered','current','approved as noted','answered'].includes((d.status||'').toLowerCase());
  const weekAgo = now - 7*86400000;
  return {
    docsTotal: docs.length,
    docsWeek: docs.filter(d=> new Date(d.createdAt||d.date).getTime() > weekAgo).length,
    drawings: docs.filter(d=>d.type==='Shop Drawing Submittal'||d.type==='Drawing Revision'||d.type==='Drawing'),
    submittals: docs.filter(d=>d.type==='Material Submittal'),
    rfis: docs.filter(d=>d.type==='RFI'),
    procurement: docs.filter(d=>['Purchase Order','LPO','Quotation'].includes(d.type)),
    invoices: docs.filter(d=>d.type==='Invoice'),
    tasksOpen: projTasks().filter(t=>t.status!=='Done'),
    overdueDocs: docs.filter(isOverdue),
  };
}

// discipline breakdown for a list of docs -> {Structural:n,...,Total:n}
function disciplineBreakdown(docs){
  const out = {}; let total = 0;
  DISCIPLINES.forEach(d=>{ const n = docs.filter(x=>x.discipline===d).length; out[d]=n; total+=n; });
  out.Total = total;
  out.Unassigned = docs.filter(x=>!x.discipline).length;
  return out;
}

// ================= AI helpers =================
async function extractTextFromFile(file){
  const name = file.name.toLowerCase();
  try{
    if(name.endsWith('.txt') || name.endsWith('.csv')){
      return await file.text();
    }
    if(name.endsWith('.pdf')){
      const buf = await file.arrayBuffer();
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      let text='';
      const pages = Math.min(pdf.numPages, 8);
      for(let i=1;i<=pages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(it=>it.str).join(' ') + '\n';
      }
      return text.trim() || '(No extractable text — this PDF may be a scanned image. OCR is not available in this environment.)';
    }
    if(name.endsWith('.docx')){
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer:buf});
      return result.value;
    }
    if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      let text='';
      wb.SheetNames.forEach(sn=>{
        const sheet = wb.Sheets[sn];
        text += `--- Sheet: ${sn} ---\n` + XLSX.utils.sheet_to_csv(sheet) + '\n';
      });
      return text.slice(0, 8000);
    }
    if(name.match(/\.(jpg|jpeg|png)$/)){
      return '(Image file — no text extracted. Image OCR is not available in this environment; classification will rely on the file name only.)';
    }
    if(name.endsWith('.pptx')){
      return '(PPTX text extraction is not wired up in this build — classification will rely on the file name only.)';
    }
  }catch(e){
    console.warn('extract failed', e);
    return '(Could not extract text from this file: ' + e.message + ')';
  }
  return '';
}

const DOC_TYPES = ['Material Submittal','Shop Drawing Submittal','RFI','Transmittal','Purchase Order','LPO','Quotation','Invoice','Delivery Note','Inspection Request','Meeting Minutes','Daily Report','Weekly Report','Method Statement','Material Approval','Test Report','NCR','Correspondence','Contract Document','Specification','Other'];

// Filename-only heuristic used when the AI (sample) capability is unavailable, so
// uploads are never blocked outright — discipline/number/revision are inferred from
// naming patterns like "MS-M-024 Rev 01", "SD-A-015 Rev 02", "RFI-S-008".
function classifyByFilename(fileName){
  const base = fileName.replace(/\.[a-z0-9]+$/i,'');
  const discipline = disciplineFromText(base);
  let type = 'Other';
  if(/^MS-/i.test(base) || /material submittal/i.test(base)) type = 'Material Submittal';
  else if(/^SD-/i.test(base) || /shop drawing/i.test(base)) type = 'Shop Drawing Submittal';
  else if(/^RFI-/i.test(base) || /^RFI/i.test(base)) type = 'RFI';
  const numberMatch = base.match(/^([A-Z]+-[A-Z]-?\d+)/i);
  const revMatch = base.match(/rev\.?\s*(\d+)/i);
  return {
    type, discipline,
    number: numberMatch ? numberMatch[1].toUpperCase() : null,
    subject: base, date: null, relatedDrawing: null, submittedBy: null,
    status: type==='Other' ? 'Submitted' : 'Submitted',
    dueDate: null, revision: revMatch ? 'Rev '+revMatch[1].padStart(2,'0') : null,
    summary: 'AI classification unavailable — fields inferred from the file name only. Please review and correct before confirming.',
  };
}

async function classifyDocument(fileName, text){
  if(!sampleApi) return classifyByFilename(fileName);
  const prompt = `You are a construction document-control assistant for a UAE construction project. Classify the uploaded document and extract key fields.
File name: "${fileName}"
Extracted text (may be partial or empty):
"""
${(text||'').slice(0,6000)}
"""
Allowed document types: ${DOC_TYPES.join(', ')}.
Allowed disciplines: Structural, Architectural, Mechanical, Electrical, Plumbing (choose the closest one if the document clearly belongs to a discipline, else null).
Respond ONLY with minified JSON, no markdown fences, no preamble, matching exactly this shape:
{"type":"<one of allowed types>","discipline":"<one of allowed disciplines, else null>","number":"<document/submittal/drawing/RFI number if found, else null>","subject":"<short subject/title — material description for a Material Submittal, drawing title for a Shop Drawing Submittal, RFI subject for an RFI>","date":"<ISO date submitted/issued if found, else null>","relatedDrawing":"<drawing number referenced, else null>","submittedBy":"<person/company if found, else null>","status":"<a reasonable initial status like Submitted / Under Review, else null>","dueDate":"<ISO review/response deadline if mentioned, else null>","revision":"<revision label like 'Rev 01', else null>","specSection":"<specification section if this is a Material Submittal, else null>","materialCategory":"<material category if this is a Material Submittal, else null>","manufacturer":"<manufacturer if mentioned, else null>","supplier":"<supplier if mentioned, else null>","subcontractor":"<subcontractor if mentioned, else null>","contractor":"<main contractor if mentioned, else null>","reviewer":"<consultant/reviewer if mentioned, else null>","drawingType":"<drawing type if this is a Shop Drawing Submittal, else null>","location":"<location/area if mentioned, else null>","relatedSpecification":"<related specification section/number, else null>","relatedMaterialSubmittal":"<related Material Submittal number, else null>","relatedShopDrawing":"<related Shop Drawing Submittal number, else null>","priority":"<RFI priority like Low/Medium/High, else null>","question":"<the RFI question/clarification requested, else null>","summary":"<2-3 sentence factual summary based only on the text given>"}`;
  try{
    const res = await sampleApi(prompt, {modelTier:'default'});
    let raw = res.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(raw);
    if(!parsed.discipline) parsed.discipline = disciplineFromText(fileName) || disciplineFromText(parsed.number);
    return parsed;
  }catch(e){
    console.warn('classification failed', e);
    return classifyByFilename(fileName);
  }
}

async function askAssistant(question){

  const proj = activeProject();

    tasks: tasks.map(t=>({title:t.title,responsible:t.responsible,dueDate:t.dueDate,status:t.status})),
  };
  const prompt = `You are the AI assistant inside a construction document-control application. Answer the user's question using ONLY the project data JSON below — never invent documents, numbers or dates that are not present. If the data doesn't contain the answer, say so plainly.
PROJECT DATA:
${JSON.stringify(dataSnapshot)}

USER QUESTION: "${question}"

Answer conversationally in a few sentences or a short list. If the user asks you to draft an email, write a complete professional email (Subject + Body) but clearly label it as a DRAFT the user must review before sending.`;

async function commitCellEdit(docId, field, rawValue){
  const doc = State.documents.find(x=>x.id===docId);
  State.editingCell = null;

  const cleared = (field==='dueDate') ? (rawValue || null) : (rawValue || '');

  if(ok) toast('Saved');

// Renders one <td> — a static value normally, or (when unlocked and this exact cell is
// mid-edit) an input/select — for a single document field. kind: 'text' | 'date' | 'select'.
function renderEditableCell(doc, field, kind, opts){
  opts = opts || {};
  const editing = State.editingCell && State.editingCell.docId===doc.id && State.editingCell.field===field;
  const locked = !State.unlocked;
  if(editing){
    if(kind==='select'){
      const options = opts.options || [];
      return `<td class="editing"><select data-cell-input data-doc-id="${doc.id}" data-field="${field}" autofocus>
        <option value="">—</option>
        ${options.map(o=>`<option value="${esc(o)}" ${((doc[field]||'')===o)?'selected':''}>${esc(o)}</option>`).join('')}
      </select></td>`;
    }
    if(kind==='date'){
      return `<td class="editing"><input type="date" data-cell-input data-doc-id="${doc.id}" data-field="${field}" value="${(doc[field]||'').toString().slice(0,10)}" autofocus></td>`;
    }
    return `<td class="editing"><input type="text" data-cell-input data-doc-id="${doc.id}" data-field="${field}" value="${esc(doc[field]||'')}" autofocus></td>`;
  }
  let display;
  if(field==='status') display = badge(doc[field]);
  else if(kind==='date') display = doc[field] ? fmtDate(doc[field]) : '—';
  else display = esc(doc[field]||'—');
  if(opts.bold) display = `<b>${display}</b>`;
  if(locked) return `<td class="locked-cell">${display}</td>`;
  return `<td class="editable-cell" data-edit-cell="${doc.id}" data-edit-field="${field}">${display}</td>`;
}

function moduleFilteredDocs(moduleKey){
  const cfg = MODULE_CONFIG[moduleKey];
  const f = (State.moduleFilters && State.moduleFilters[moduleKey]) || {discipline:'ALL', search:''};
  let docs = projDocs().filter(d=>cfg.types.includes(d.type));
  const allInModule = docs;
  if(f.discipline && f.discipline!=='ALL') docs = docs.filter(d=>d.discipline===f.discipline);
  cfg.filters.forEach(flt=>{ if(f[flt.key]) docs = docs.filter(d=> (d[flt.key]||'')===f[flt.key]); });
  if(f.search){ const q=f.search.toLowerCase(); docs = docs.filter(d=> cfg.search.some(k=>(d[k]||'').toString().toLowerCase().includes(q))); }
  return {docs, allInModule, f, cfg};
}

function exportRowsToPDF(rows, title){
  if(!rows || !rows.length){ toast('Nothing to export yet'); return; }
  if(!window.jspdf){ toast('PDF export unavailable right now'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  const headers = Object.keys(rows[0]);
  const body = rows.map(r => headers.map(h => r[h] ?? ''));
  doc.setFontSize(14);
  doc.text(title, 14, 15);
  doc.autoTable({ head: [headers], body, startY: 20, styles: { fontSize: 8 }, headStyles: { fillColor: [34,31,31] } });
  doc.save(title.replace(/\s+/g,'_') + '.pdf');
}

function exportModuleExcel(moduleKey){
  const {docs, f, cfg} = moduleFilteredDocs(moduleKey);
  if(!docs.length){ toast('Nothing to export for this view'); return; }
  const rows = docs.map(d=>{
    const row={};
    cfg.columns.forEach(c=>{ row[c.label] = c.fmt==='date' ? fmtDate(d[c.key]) : (d[c.key]||''); });
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  const sheetTitle = ((f.discipline&&f.discipline!=='ALL') ? f.discipline+' ' : 'All ')+cfg.title;
  XLSX.utils.book_append_sheet(wb, ws, sheetTitle.slice(0,31));
  const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  downloadBlob(new Blob([out],{type:'application/octet-stream'}), sheetTitle.replace(/\s+/g,'_')+'.xlsx');
}

function exportModulePDF(moduleKey){
  const {docs, f, cfg} = moduleFilteredDocs(moduleKey);
  if(!docs.length){ toast('Nothing to export for this view'); return; }
  const rows = docs.map(d=>{
    const row={};
    cfg.columns.forEach(c=>{ row[c.label] = c.fmt==='date' ? fmtDate(d[c.key]) : (d[c.key]||''); });
    return row;
  });
  const sheetTitle = ((f.discipline&&f.discipline!=='ALL') ? f.discipline+' ' : 'All ')+cfg.title;
  exportRowsToPDF(rows, sheetTitle);
}

function renderDaily(){
  const docs = projDocs();

  const today = docs.filter(d=> new Date(d.createdAt||d.date).getTime() > dayAgo);
  const tasks = projTasks().filter(t=>t.status!=='Done');
  const dueSoon = tasks.filter(t=>{ const d=daysUntil(t.dueDate); return d!==null && d<=3; });
  return pageHead("Today's Project Activity", `As of ${fmtDate(new Date().toISOString())}`) +
  `<div class="card">

function disciplineStatusTable(title, docs){
  const now = Date.now();
  const closedLike = s => ['approved','approved as noted','closed','current'].includes((s||'').toLowerCase());
  const rows = DISCIPLINES.map(disc=>{
    const dd = docs.filter(d=>d.discipline===disc);
    const total = dd.length;
    const approved = dd.filter(d=>closedLike(d.status)).length;
    const overdue = dd.filter(d=> d.dueDate && new Date(d.dueDate).getTime()<now && !closedLike(d.status)).length;
    return {disc, total, pending: total-approved, approved, overdue};
  });
  return `<div class="section-title">${esc(title)}</div>
  <div class="card overflow-x"><table><thead><tr><th>Discipline</th><th style="text-align:right;">Total</th><th style="text-align:right;">Pending</th><th style="text-align:right;">Approved</th><th style="text-align:right;">Overdue</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.disc}</td><td style="text-align:right;">${r.total}</td><td style="text-align:right;">${r.pending}</td><td style="text-align:right;">${r.approved}</td><td style="text-align:right;">${r.overdue}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function renderModal(){
  const m = State.modal;
  if(m.type==='projectForm') return projectFormModal(m.project);
  if(m.type==='reviewDoc') return reviewDocModal(m.data);
  if(m.type==='importSummary') return importSummaryModal(m.data, m.previousRevLabel);
  if(m.type==='importMapping') return importMappingModal(m);
  if(m.type==='bulkImportSummary') return bulkImportSummaryModal(m);
  if(m.type==='bulkImportDone') return bulkImportDoneModal(m);
  if(m.type==='viewDoc') return viewDocModal(m.doc);
  if(m.type==='newTask') return newTaskModal();
  if(m.type==='unlock') return unlockModal();
  if(m.type==='confirmDelete') return confirmDeleteModal(m);
  if(m.type==='emailDraft') return null; // rendered inline, not modal
  return '';
}

function findRecordByNumber(type, number){
  if(!number) return null;
  return State.documents.find(x=>x.projectId===State.activeProjectId && x.number===number &&
    (Array.isArray(type)?type.includes(x.type):x.type===type));
}

// ================= EVENT HANDLERS =================
function attachHandlers(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.addEventListener('click', ()=>{ State.route = el.getAttribute('data-route'); render(); });
  });
  const psel = document.getElementById('projectSelect');
  if(psel) psel.addEventListener('change', e=>{ State.activeProjectId = e.target.value; render(); });

  document.getElementById('createFirstProject')?.addEventListener('click', ()=>{ if(!requireUnlock()) return; State.modal={type:'projectForm'}; render(); });
  document.getElementById('newProjectBtn')?.addEventListener('click', ()=>{ if(!requireUnlock()) return; State.modal={type:'projectForm'}; render(); });
  document.querySelectorAll('[data-edit-project]').forEach(el=>{
    el.addEventListener('click', ()=>{ if(!requireUnlock()) return; const p = State.projects.find(x=>x.id===el.getAttribute('data-edit-project')); State.modal={type:'projectForm',project:p}; render(); });

// ================= BULK EXCEL IMPORT (Automatic File Update, §26-28) =================
// Single centralized flow reused by all three modules: read → map columns → diff
// against existing records (matched by number) → show counts → confirm → apply.
// Never overwrites blindly; unchanged rows are left as-is; nothing is deleted.
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return 'sig'+Math.abs(h); }
function norm(s){ return (s||'').toString().toLowerCase().replace(/[^a-z0-9]+/g,''); }

const FIELD_SYNONYMS = {
  materialsubmittal: {
    number:['msno','materialsubmittalno','submittalno','msnumber','no'], discipline:['discipline'],
    specSection:['specsection','specificationsection','spec'], materialCategory:['materialcategory','category'],
    subject:['materialdescription','description','desc','materialdesc'], manufacturer:['manufacturer','mfr'],
    supplier:['supplier'], subcontractor:['subcontractor','subcon'], dateRequired:['daterequired'],
    date:['datesubmitted','submitteddate'], revision:['revision','rev'], submittedBy:['submittedby'],
    reviewer:['reviewer'], dueDate:['reviewdeadline','duedate','deadline'], dateReturned:['datereturned','returned'],
    status:['status'], summary:['reviewcomments','comments','remarks'], relatedDrawing:['relateddrawingno','drawingno'],
    relatedSpecification:['relatedspecification'], location:['location','area','locationarea'],
    materialApprovalRef:['materialapprovalreference','approvalreference'],
  },
  shopdrawing: {
    number:['sdno','shopdrawingsubmittalno','drawingsubmittalno','no'], discipline:['discipline'],
    subject:['drawingtitle','title'], drawingType:['drawingtype'], subcontractor:['subcontractor'],
    contractor:['contractor'], reviewer:['consultantreviewer','reviewer','consultant'],
    date:['submissiondate','datesubmitted'], dueDate:['reviewdeadline','duedate'], revision:['revision','rev'],
    previousRevision:['previousrevision'], status:['status'], dateReturned:['datereturned'],
    summary:['reviewcomments','comments','remarks'], location:['location','area'],
    relatedSpecification:['relatedspecification'], relatedMaterialSubmittal:['relatedmaterialsubmittal'],
    relatedDrawing:['relateddrawingno','drawingno'],
  },
  rfi: {
    number:['rfino','rfinumber','no'], discipline:['discipline'], subject:['subject'],
    question:['questionclarification','question'], location:['locationarea','location'],
    submittedBy:['submittedby'], contractor:['contractorsubcontractor','contractor'], date:['datesubmitted'],
    dueDate:['requiredresponsedate','duedate'], reviewer:['reviewer'], status:['status'],
    dateResponded:['dateresponded'], response:['response'], relatedDrawing:['relateddrawingno'],
    relatedShopDrawing:['relatedshopdrawing'], relatedMaterialSubmittal:['relatedmaterialsubmittal'],
    relatedSpecification:['relatedspecification'], priority:['priority'],
  },
};
const FIELD_LABELS = {
  materialsubmittal: {number:'Material Submittal No.', discipline:'Discipline', specSection:'Specification Section', materialCategory:'Material Category', subject:'Material Description', manufacturer:'Manufacturer', supplier:'Supplier', subcontractor:'Subcontractor', dateRequired:'Date Required', date:'Date Submitted', revision:'Revision', submittedBy:'Submitted By', reviewer:'Reviewer', dueDate:'Review Deadline', dateReturned:'Date Returned', status:'Status', summary:'Review Comments', relatedDrawing:'Related Drawing No.', relatedSpecification:'Related Specification', location:'Location / Area', materialApprovalRef:'Material Approval Reference'},
  shopdrawing: {number:'Shop Drawing Submittal No.', discipline:'Discipline', subject:'Drawing Title', drawingType:'Drawing Type', subcontractor:'Subcontractor', contractor:'Contractor', reviewer:'Consultant / Reviewer', date:'Submission Date', dueDate:'Review Deadline', revision:'Revision', previousRevision:'Previous Revision', status:'Status', dateReturned:'Date Returned', summary:'Review Comments', location:'Location / Area', relatedSpecification:'Related Specification', relatedMaterialSubmittal:'Related Material Submittal', relatedDrawing:'Drawing No.'},
  rfi: {number:'RFI No.', discipline:'Discipline', subject:'Subject', question:'Question / Clarification', location:'Location / Area', submittedBy:'Submitted By', contractor:'Contractor / Subcontractor', date:'Date Submitted', dueDate:'Required Response Date', reviewer:'Reviewer', status:'Status', dateResponded:'Date Responded', response:'Response', relatedDrawing:'Related Drawing No.', relatedShopDrawing:'Related Shop Drawing', relatedMaterialSubmittal:'Related Material Submittal', relatedSpecification:'Related Specification', priority:'Priority'},
};

function guessMappingFor(moduleKey, headers){
  const syn = FIELD_SYNONYMS[moduleKey]; const mapping = {}; let score = 0;
  headers.forEach(h=>{
    const n = norm(h); let matched = null;
    for(const [field, list] of Object.entries(syn)){ if(list.includes(n)){ matched = field; break; } }
    mapping[h] = matched; if(matched) score++;
  });
  return {mapping, score};
}
async function guessMapping(headers){
  const sig = hashStr(headers.slice().sort().join('|').toLowerCase());
  if(dbApi){
    try{
      const saved = await dbApi.collection('importMappings').doc(sig).get();
      const data = saved && (saved.data || saved);
      if(data && data.mapping && data.moduleKey) return {moduleKey:data.moduleKey, mapping:data.mapping, sig};
    }catch(e){ /* no saved mapping for this header signature yet */ }
  }
  let best = {moduleKey:'materialsubmittal', score:-1, mapping:{}};
  Object.keys(FIELD_SYNONYMS).forEach(mk=>{
    const {mapping, score} = guessMappingFor(mk, headers);
    if(score > best.score) best = {moduleKey:mk, score, mapping};
  });
  return {moduleKey:best.moduleKey, mapping:best.mapping, sig};
}

async function tryBulkExcelImport(file){
  const name = file.name.toLowerCase();
  if(!(name.endsWith('.xlsx') || name.endsWith('.xls'))) return false;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(rows.length < 2) return false; // a single-row file is treated as one document, not a register
    const headers = Object.keys(rows[0]);
    const {moduleKey, mapping, sig} = await guessMapping(headers);
    State.modal = {type:'importMapping', fileName:file.name, headers, rows, moduleKey, mapping, sig};
    render();
    return true;
  }catch(e){ console.warn('bulk excel detection failed', e); return false; }
}

function computeImportDiff(moduleKey, rows, mapping){
  const cfg = MODULE_CONFIG[moduleKey];
  const existing = State.documents.filter(d=>d.projectId===State.activeProjectId && cfg.types.includes(d.type));
  const processed = [];
  const seen = new Set(); const dups = new Set();
  rows.forEach(row=>{
    const rec = {};
    Object.entries(mapping).forEach(([h,f])=>{ if(f) rec[f] = row[h]!==undefined ? String(row[h]).trim() : ''; });
    if(!rec.discipline) rec.discipline = disciplineFromText(rec.number) || disciplineFromText(rec.subject) || null;
    if(rec.number){ if(seen.has(rec.number)) dups.add(rec.number); seen.add(rec.number); }
    processed.push(rec);
  });
  let newCount=0, updatedCount=0, revisionCount=0, unchangedCount=0;
  const actions = [];
  processed.forEach(rec=>{
    if(!rec.number){ actions.push({rec, action:'new'}); newCount++; return; }
    const match = existing.find(x=>x.number===rec.number && x.status!=='Superseded');
    if(!match){ actions.push({rec, action:'new'}); newCount++; return; }
    if(rec.revision && match.revision && rec.revision!==match.revision){
      actions.push({rec, action:'revision', matchId:match.id, previousRevision:match.revision}); revisionCount++; return;
    }
    const changed = Object.keys(rec).some(k=> (rec[k]||'') !== (match[k]||''));
    if(changed){ actions.push({rec, action:'update', matchId:match.id}); updatedCount++; }
    else unchangedCount++;
  });
  return {actions, newCount, updatedCount, revisionCount, unchangedCount, duplicateCount:dups.size, total:processed.length};
}

async function generateChangeSummary(moduleTitle, diff, actions){
  const revLines = actions.filter(a=>a.action==='revision').map(a=>`${a.rec.number} revised${a.rec.revision?(' to '+a.rec.revision):''}`);
  const statusChanges = actions.filter(a=>a.action==='update' && a.rec.status).map(a=>`${a.rec.number} status set to ${a.rec.status}`);
  const fallback = `${diff.newCount} new ${moduleTitle} record(s) were added. ${diff.updatedCount} were updated. ${diff.revisionCount} revision(s) were received.${diff.duplicateCount?` ${diff.duplicateCount} potential duplicate number(s) were flagged in the file.`:''}`;
  if(!sampleApi) return fallback;
  const facts = `Module: ${moduleTitle}. New: ${diff.newCount}. Updated: ${diff.updatedCount}. Revisions: ${diff.revisionCount}. Unchanged: ${diff.unchangedCount}. Potential duplicates: ${diff.duplicateCount}. Revision details: ${revLines.join('; ')||'none'}. Status changes: ${statusChanges.join('; ')||'none'}.`;
  try{
    const res = await sampleApi(`You are a construction document-control assistant. Using ONLY the facts below — never invent a number, discipline or status not listed — write a 2-4 sentence factual summary of what changed in this import, for a document controller's activity log.\nFACTS: ${facts}`, {modelTier:'quick'});
    return res.text;
  }catch(e){ return fallback; }
}

async function applyBulkImport(state){
  const {moduleKey, diff} = state;
  const cfg = MODULE_CONFIG[moduleKey];
  for(const a of diff.actions){
    if(a.action==='new'){
      const doc = {id:uid(), projectId:State.activeProjectId, type:cfg.types[0], status:'Submitted', createdAt:new Date().toISOString(), ...a.rec};
      State.documents.push(doc); await persist('documents', doc.id, doc);
    } else if(a.action==='update'){
      const doc = State.documents.find(x=>x.id===a.matchId);
      if(doc){ Object.assign(doc, a.rec); await persist('documents', doc.id, doc); }
    } else if(a.action==='revision'){
      const old = State.documents.find(x=>x.id===a.matchId);
      if(old){ old.status='Superseded'; await persist('documents', old.id, old); }
      const doc = {id:uid(), projectId:State.activeProjectId, type:cfg.types[0], status:'Submitted', createdAt:new Date().toISOString(), previousRevision:a.previousRevision, ...a.rec};
      State.documents.push(doc); await persist('documents', doc.id, doc);
    }
  }
  await logActivity(State.activeProjectId, `${state.fileName} imported into ${cfg.title}: ${diff.newCount} new, ${diff.updatedCount} updated, ${diff.revisionCount} revision change(s), ${diff.unchangedCount} unchanged.`);
  if(dbApi && state.sig){
    try{ await dbApi.collection('importMappings').doc(state.sig).set({moduleKey, mapping:state.mapping}); }catch(e){}
  }
  const summary = await generateChangeSummary(cfg.title, diff, diff.actions);
  State.modal = {type:'bulkImportDone', summary, diff, title:cfg.title};
  render();
}

async function handleFiles(fileList){
  const files = Array.from(fileList);
  const statusEl = document.getElementById('uploadStatus');
  for(const file of files){
    statusEl.innerHTML = `<div class="card" style="margin-bottom:10px;"><span class="spinner"></span> Reading ${esc(file.name)}…</div>`;
    const bulkHandled = await tryBulkExcelImport(file);
    if(bulkHandled){ statusEl.innerHTML=''; return; }
    const text = await extractTextFromFile(file);
    statusEl.innerHTML = `<div class="card" style="margin-bottom:10px;"><span class="spinner"></span> AI is classifying ${esc(file.name)}…</div>`;
    let assetId = null;
    if(assetsApi){
      try{ const uploaded = await assetsApi.upload(file); assetId = uploaded.id; }catch(e){ console.warn('asset upload failed', e); }
    }
    const ai = await classifyDocument(file.name, text);
    statusEl.innerHTML = '';
    const draft = {
      id: uid(), fileName: file.name, assetId,
      type: ai?.type || 'Other', number: ai?.number || '', subject: ai?.subject || file.name,
      date: ai?.date || new Date().toISOString(), relatedDrawing: ai?.relatedDrawing || '',
      submittedBy: ai?.submittedBy || '', status: ai?.status || 'Submitted',
      dueDate: ai?.dueDate || null, revision: ai?.revision || '', summary: ai?.summary || (ai ? '' : 'AI classification unavailable — please fill in the fields manually.'),
      discipline: ai?.discipline || '', specSection: ai?.specSection || '', materialCategory: ai?.materialCategory || '',
      manufacturer: ai?.manufacturer || '', supplier: ai?.supplier || '', subcontractor: ai?.subcontractor || '',
      contractor: ai?.contractor || '', reviewer: ai?.reviewer || '', drawingType: ai?.drawingType || '',
      location: ai?.location || '', relatedSpecification: ai?.relatedSpecification || '',
      relatedMaterialSubmittal: ai?.relatedMaterialSubmittal || '', relatedShopDrawing: ai?.relatedShopDrawing || '',
      priority: ai?.priority || '', question: ai?.question || '',
    };
    // detect a new revision of an existing record so the preview can flag it up front
    if(draft.number && (draft.type==='Material Submittal' || draft.type==='Shop Drawing Submittal')){
      const prior = State.documents.filter(x=>x.projectId===State.activeProjectId && x.type===draft.type && x.number===draft.number);
      if(prior.length){
        const latest = prior.slice().sort((a,b)=> (b.revision||'').localeCompare(a.revision||''))[0];
        draft.previousRevision = latest.revision || '';
        draft.isRevisionUpdate = true;
      }
    }
    State.modal = {type:'reviewDoc', data: draft};
    render();
    return; // handle one at a time so each gets its own review screen
  }
}

async function sendChat(){
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if(!q) return;
  input.value='';
  if(!State.chatLog) State.chatLog=[];
  State.chatLog.push({role:'user', text:q});
  State.chatBusy = true;
  render();
  const answer = await askAssistant(q);
  State.chatLog.push({role:'ai', text:answer});
  State.chatBusy = false;
  render();
  const log = document.getElementById('chatLog');
  if(log) log.scrollTop = log.scrollHeight;
}

async function generateDraftEmail(instruction){
  const out = document.getElementById('emailDraftOutput');
  out.innerHTML = `<div class="card"><span class="spinner"></span> Drafting…</div>`;
  const text = await askAssistant(`Draft ${instruction}. Sign off as ${activeProject()?.docController || 'the Document Controller'}.`);
  out.innerHTML = `<div class="card"><h4>Draft (review before sending)</h4><div style="white-space:pre-wrap;font-size:13px;">${esc(text)}</div>
    <p class="limits-note">This is a draft only — copy it into your mail client. Live send requires connecting a real email account via OAuth, which isn't available in this build.</p>
  </div>`;
}

function exportRegisterExcel(title){
  let docs;
  const map = {'RFI Register':'RFI','Submittal Register':'Material Submittal','Invoice Register':'Invoice'};
  if(title==='All Documents' || title==='Document Register') docs = projDocs();
  else if(title==='Procurement Register') docs = projDocs().filter(d=>['Purchase Order','LPO','Quotation'].includes(d.type));
  else docs = projDocs().filter(d=>d.type===map[title]);
  if(!docs || !docs.length){ toast('Nothing to export yet'); return; }
  const rows = docs.map(d=>({Number:d.number,Type:d.type,Subject:d.subject,Date:fmtDate(d.date),Status:d.status,'Related Drawing':d.relatedDrawing,'Submitted By':d.submittedBy,'Due Date':d.dueDate?fmtDate(d.dueDate):'',Revision:d.revision||''}));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, title.slice(0,31));
  const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
  downloadBlob(new Blob([out],{type:'application/octet-stream'}), title.replace(/\s+/g,'_')+'.xlsx');
}

async function exportProjectBackup(){
  const proj = activeProject();
  const payload = {
    exportedAt: new Date().toISOString(),
    project: proj,
    documents: projDocs(),
    tasks: projTasks(),
    activity: projActivity(),
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  downloadBlob(blob, (proj.number||proj.name).replace(/\s+/g,'_')+'_backup.json');
}

async function importProjectBackup(file){
  if(!file) return;
  try{
    const text = await file.text();
    const payload = JSON.parse(text);
    const newProjId = uid();
    const p = {...payload.project, id:newProjId, name:(payload.project.name||'Imported Project')+' (Imported)'};
    State.projects.push(p); await persist('projects', newProjId, p);
    for(const d of (payload.documents||[])){
      const nd = {...d, id:uid(), projectId:newProjId}; State.documents.push(nd); await persist('documents', nd.id, nd);
    }
    for(const t of (payload.tasks||[])){
      const nt = {...t, id:uid(), projectId:newProjId}; State.tasks.push(nt); await persist('tasks', nt.id, nt);
    }
    for(const a of (payload.activity||[])){
      const na = {...a, id:uid(), projectId:newProjId}; State.activity.push(na); await persist('activity', na.id, na);
    }
    State.activeProjectId = newProjId;
    toast('Project imported');
    render();
  }catch(e){
    toast('Import failed: '+e.message);
  }
}

async function downloadBlob(blob, filename){
  if(downloadsApi){
    try{
      const buf = await blob.arrayBuffer();
      await downloadsApi.save({filename, data: buf});
      return;
    }catch(e){ console.warn('downloads capability failed, falling back', e); }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
